{% extends "base.html" %}

{% block title %}Error - Trello AI Bot{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-12">
    <div class="text-center">
        <i class="fas fa-exclamation-triangle text-6xl text-yellow-500 mb-4"></i>
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Error</h1>
        <p class="text-gray-600 mb-6">Ha ocurrido un error inesperado</p>
        <div class="bg-red-50 border border-red-200 rounded-lg p-4 max-w-md mx-auto">
            <p class="text-red-800 font-mono text-sm">{{ error }}</p>
        </div>
        <div class="mt-6">
            <a href="/dashboard" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg">
                <i class="fas fa-home mr-2"></i>Volver al Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
